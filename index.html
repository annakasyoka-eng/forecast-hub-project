<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="styles/index.css">
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
</head>
<body>
  <div class="container">
     <header>
      <form class="search-form">
        <input type="search" placeholder="Enter a city..." required class="search-form-input"/>
        <input type="submit" value="Search" class="search-form-button"/>
      </form>
     </header>
     <main>
      <div class="weather-app-data">      
       <div>
         <h1 class="weather-app-city">
          Monaco
         </h1>
         <p class="weather-app-details">
          <span id="time"></span>,<span id="description"></span>
          <br>
          Humidity: <strong id="humidity"></strong>, Wind:  <strong id="wind"></strong>
         </p>
       </div>
        <div class="weather-app-container">
         <div class="weather-app-icon" id="icon"></div>
         <div class="weather-app-temperature">15</div>
         <div class="weather-app-unit">°C</div>
        </div>
      </div>
     </main>

     <footer>
        This project was coded by 
        <a href="https://github.com/annakasyoka-eng" target="_blank">Anna Kasyoka</a>,
         and is
         <a href = "https://github.com/annakasyoka-eng/forecast-hub-project" target="_blank"
         >open-sourced on github</a> 
         and
         <a href="https://forecast-hub-project.netlify.app/" target="_blank"
         >hosted on Netlify</a>
    </footer>
  </div>
  
  <script src="index.js"></script>

</body>
</html>
